<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Currency Comps</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ── CONFIG: Update these if your Supabase project changes ── */
:root {
  --sb-url: "https://wqizwluccqqfkedpgvve.supabase.co";
  /* anon key is set in JS below */

  /* Theme */
  --bg: #0e0e12;
  --surface: #18181f;
  --surface2: #1f1f28;
  --border: #2a2a35;
  --gold: #c8a84e;
  --gold-dim: #8a7535;
  --text: #e8e4dc;
  --muted: #8a8680;
  --accent: #4a9eff;
  --red: #e55;
  --green: #4a4;
  --font: 'Segoe UI', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }
body.light { --bg: #f4f1eb; --surface: #fff; --surface2: #f0ede6; --border: #d5d0c8; --text: #2a2520; --muted: #6a6560; }

/* ── HEADER ── */
.hdr { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--surface); }
.hdr h1 { font-size: 22px; color: var(--gold); letter-spacing: 1px; }
.hdr .stats { display: flex; gap: 14px; font-size: 13px; color: var(--muted); }
.hdr .stats b { color: var(--text); }
.conn-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
.conn-dot.ok { background: var(--green); }
.conn-dot.err { background: var(--red); }
.conn-dot.loading { background: var(--gold); animation: pulse .8s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.theme-btn { background: none; border: 1px solid var(--border); color: var(--muted); cursor: pointer; border-radius: 6px; padding: 4px 10px; font-size: 16px; }
.ver { font-size: 11px; color: var(--muted); margin-left: 8px; }

/* ── CONN BANNER ── */
.conn-banner { background: #331a1a; color: #faa; padding: 10px 20px; font-size: 13px; display: none; align-items: center; gap: 10px; }
.conn-banner.show { display: flex; }
.conn-banner button { background: var(--red); color: #fff; border: none; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }

/* ── FILTERS ── */
.filters { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 20px; background: var(--surface); border-bottom: 1px solid var(--border); align-items: flex-end; }
.fg { display: flex; flex-direction: column; gap: 2px; }
.fg label { font-size: 10px; text-transform: uppercase; color: var(--muted); letter-spacing: .5px; }
.fg input, .fg select { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 5px 8px; border-radius: 4px; font-size: 13px; width: 110px; }
.fg select { width: 120px; }
.fg input:focus, .fg select:focus { outline: none; border-color: var(--gold); }
.fg.wide input { width: 200px; }
.cat-chips { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 20px 10px; background: var(--surface); border-bottom: 1px solid var(--border); }
.chip { padding: 4px 10px; border-radius: 12px; font-size: 12px; cursor: pointer; border: 1px solid var(--border); background: var(--surface2); color: var(--muted); transition: all .15s; }
.chip.active { background: var(--gold); color: #000; border-color: var(--gold); }
.chip:hover { border-color: var(--gold-dim); }
.nbn-row { display: none; padding: 6px 20px; background: var(--surface); border-bottom: 1px solid var(--border); gap: 8px; align-items: flex-end; }
.nbn-row.show { display: flex; }
.nbn-toggle { cursor: pointer; color: var(--gold-dim); font-size: 12px; padding: 0 20px 6px; background: var(--surface); }
.btn-row { display: flex; gap: 8px; padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--border); }
.btn { padding: 7px 18px; border-radius: 4px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; }
.btn-go { background: var(--gold); color: #000; }
.btn-go:hover { background: #d4b458; }
.btn-clear { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
.btn-export { background: var(--surface2); color: var(--accent); border: 1px solid var(--border); }
.star-toggle { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--gold); cursor: pointer; }
.star-toggle input { accent-color: var(--gold); }

/* ── ESTIMATE CARD ── */
.est-card { margin: 14px 20px; padding: 12px 16px; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; display: flex; gap: 24px; align-items: center; font-size: 13px; }
.est-card .price { font-size: 24px; font-weight: 700; color: var(--gold); }
.est-card .meta { color: var(--muted); }

/* ── TABLE ── */
.tbl-wrap { overflow-x: auto; padding: 0 20px; }
table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; }
th { text-align: left; padding: 8px 6px; border-bottom: 2px solid var(--border); color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; cursor: pointer; white-space: nowrap; user-select: none; }
th:hover { color: var(--gold); }
th.sorted { color: var(--gold); }
td { padding: 6px; border-bottom: 1px solid var(--border); white-space: nowrap; }
tr:hover td { background: var(--surface2); }
td a { color: var(--accent); text-decoration: none; }
td a:hover { text-decoration: underline; }
.loading-row td { text-align: center; color: var(--muted); padding: 30px; font-size: 14px; }
.empty-row td { text-align: center; color: var(--muted); padding: 30px; }

/* ── PAGINATION ── */
.pager { display: flex; justify-content: center; align-items: center; gap: 12px; padding: 14px; font-size: 13px; color: var(--muted); }
.pager button { background: var(--surface2); color: var(--text); border: 1px solid var(--border); padding: 5px 14px; border-radius: 4px; cursor: pointer; }
.pager button:disabled { opacity: .3; cursor: default; }
</style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <div style="display:flex;align-items:center;gap:8px;">
    <h1>Currency Comps</h1>
    <span class="ver">v2.4</span>
  </div>
  <div class="stats">
    <span><span class="conn-dot loading" id="connDot"></span> <span id="connLabel">Connecting…</span></span>
    <span>HA: <b id="haCount">—</b></span>
    <span>SB: <b id="sbCount">—</b></span>
    <span>Total: <b id="totalCount">—</b></span>
    <span>Matching: <b id="matchCount">—</b></span>
    <button class="theme-btn" onclick="toggleTheme()" title="Toggle light/dark">☾</button>
  </div>
</div>

<!-- CONNECTION ERROR BANNER -->
<div class="conn-banner" id="connBanner">
  <span id="connError">Connection failed</span>
  <button onclick="initSupabase()">Retry</button>
</div>

<!-- FILTERS -->
<div class="filters">
  <div class="fg"><label>Source</label>
    <select id="fSource"><option value="">All sources</option><option value="heritage">Heritage Auctions</option><option value="stacks">Stack's Bowers</option></select>
  </div>
  <div class="fg wide"><label>Title contains</label><input id="fTitle" placeholder=""></div>
  <div class="fg"><label>Friedberg #</label><input id="fFr" placeholder=""></div>
  <div class="fg"><label>Year</label><input id="fYear" placeholder="" style="width:70px"></div>
  <div class="fg"><label>Letter</label><input id="fLetter" placeholder="" style="width:50px"></div>
  <div class="fg"><label>Denom</label>
    <select id="fDenom"><option value="">any</option><option>$1</option><option>$2</option><option>$5</option><option>$10</option><option>$20</option><option>$50</option><option>$100</option><option>$500</option><option>$1000</option><option>$5000</option><option>$10000</option></select>
  </div>
  <div class="fg"><label>Co.</label>
    <select id="fService"><option value="">any</option><option>PMG</option><option>PCGS</option><option>NGC</option><option value="raw">raw</option><option value="unknown">unknown</option></select>
  </div>
  <div class="fg"><label>PPQ/EPQ</label>
    <select id="fQual"><option value="">any</option><option>PPQ</option><option>EPQ</option><option value="none">none</option></select>
  </div>
  <div class="fg"><label>Grade min</label><input id="fGradeMin" type="number" style="width:70px"></div>
  <div class="fg"><label>Grade max</label><input id="fGradeMax" type="number" style="width:70px"></div>
  <div class="fg"><label>Price min</label><input id="fPriceMin" type="number" style="width:90px"></div>
  <div class="fg"><label>Price max</label><input id="fPriceMax" type="number" style="width:90px"></div>
  <div class="fg"><label>From</label><input id="fDateFrom" type="date"></div>
  <div class="fg"><label>To</label><input id="fDateTo" type="date"></div>
  <label class="star-toggle"><input type="checkbox" id="fStar"> ★ Star only</label>
</div>

<div class="nbn-toggle" onclick="document.querySelector('.nbn-row').classList.toggle('show')">▸ National Banks (charter / state)</div>
<div class="nbn-row">
  <div class="fg"><label>State</label><input id="fState" placeholder="" style="width:60px"></div>
  <div class="fg"><label>Charter #</label><input id="fCharter" placeholder="" style="width:80px"></div>
</div>

<div class="cat-chips" id="catChips"></div>

<div class="btn-row">
  <button class="btn btn-go" onclick="doSearch()">Apply filters</button>
  <button class="btn btn-clear" onclick="clearFilters()">Clear</button>
  <button class="btn btn-export" onclick="exportCSV()">Export CSV</button>
</div>

<!-- ESTIMATE CARD -->
<div class="est-card">
  <div><div style="font-size:11px;color:var(--muted)">Current Estimated Price</div><div class="price" id="estPrice">—</div></div>
  <div class="meta"><div>Mean<span id="estMean" style="margin-left:6px">—</span></div><div>Low / High<span id="estRange" style="margin-left:6px">—</span></div><div>Sample size<span id="estN" style="margin-left:6px">—</span></div></div>
</div>

<!-- TABLE -->
<div class="tbl-wrap">
<table>
<thead><tr>
  <th data-col="row">#</th>
  <th data-col="description_full" class="sorted">Title</th>
  <th data-col="fr_number">Friedberg</th>
  <th data-col="year_series">Series</th>
  <th data-col="denomination">Denom</th>
  <th data-col="category_parent">Type</th>
  <th data-col="grade_text">Grading</th>
  <th data-col="is_star">★</th>
  <th data-col="sold_for">Sold</th>
  <th data-col="auction_end_date">Date</th>
  <th data-col="source">Src</th>
</tr></thead>
<tbody id="tbody"><tr class="loading-row"><td colspan="11">Connecting to database…</td></tr></tbody>
</table>
</div>

<!-- PAGINATION -->
<div class="pager">
  <button id="pgPrev" onclick="changePage(-1)" disabled>‹ Prev</button>
  <span id="pgInfo">—</span>
  <button id="pgNext" onclick="changePage(1)" disabled>Next ›</button>
</div>

<script>
// ═══ SUPABASE CONFIG ═══
const SUPABASE_URL = "https://wqizwluccqqfkedpgvve.supabase.co";
const SUPABASE_KEY = "sb_publishable_9DiOeDQje6yiSEITD7WUrw_S2Q-2xyS";

let sb = null;
let rows = [];
let page = 0;
const PER = 50;
let sortCol = "auction_end_date";
let sortAsc = false;
let totalMatching = 0;
let categories = [];
let activeCat = "";

// ── THEME ──
function toggleTheme() {
  document.body.classList.toggle("light");
  localStorage.setItem("theme", document.body.classList.contains("light") ? "light" : "dark");
}
if (localStorage.getItem("theme") === "light") document.body.classList.add("light");

// ── SUPABASE INIT ──
async function initSupabase() {
  const dot = document.getElementById("connDot");
  const label = document.getElementById("connLabel");
  const banner = document.getElementById("connBanner");
  const errSpan = document.getElementById("connError");

  dot.className = "conn-dot loading";
  label.textContent = "Connecting…";
  banner.classList.remove("show");

  try {
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const { count, error } = await sb.from("lots").select("*", { count: "exact", head: true });
    if (error) throw new Error(error.message || "Query failed");

    dot.className = "conn-dot ok";
    label.textContent = count.toLocaleString() + " lots";
    document.getElementById("totalCount").textContent = count.toLocaleString();

    const { count: haC } = await sb.from("lots").select("*", { count: "exact", head: true }).eq("house_id", 1);
    const { count: sbC } = await sb.from("lots").select("*", { count: "exact", head: true }).eq("house_id", 2);
    document.getElementById("haCount").textContent = (haC || 0).toLocaleString();
    document.getElementById("sbCount").textContent = (sbC || 0).toLocaleString();

    await loadCategories();
    document.getElementById("tbody").innerHTML = '<tr class="empty-row"><td colspan="11">Apply filters or search to view results</td></tr>';

  } catch (e) {
    dot.className = "conn-dot err";
    label.textContent = "Disconnected";

    let msg = e.message || "Unknown error";
    if (msg.includes("CERT") || msg.includes("cert") || msg.includes("SSL") || msg.includes("ERR_CERT")) {
      msg = "SSL certificate error — your Supabase project may be paused.";
    } else if (msg.includes("Failed to fetch") || msg.includes("NetworkError")) {
      msg = "Network error — Supabase project may be paused or offline.";
    }

    errSpan.textContent = msg;
    banner.classList.add("show");
    document.getElementById("tbody").innerHTML = '<tr class="empty-row"><td colspan="11" style="color:var(--red)">Database connection failed.</td></tr>';
    console.error("Supabase connection error:", e);
  }
}

// ── CATEGORIES ──
async function loadCategories() {
  try {
    const { data } = await sb.from("lots").select("category_parent").not("category_parent", "is", null).limit(1000);
    const set = new Set();
    (data || []).forEach(r => { if (r.category_parent) set.add(r.category_parent.split("»")[0].trim()); });
    categories = [...set].sort();
    renderChips();
  } catch(e) { console.warn("Category load failed", e); }
}

function renderChips() {
  const el = document.getElementById("catChips");
  el.innerHTML = categories.map(c =>
    `<span class="chip${activeCat === c ? ' active' : ''}" onclick="toggleCat('${c.replace(/'/g,"\\'")}')">${c}</span>`
  ).join("");
}

function toggleCat(c) {
  activeCat = activeCat === c ? "" : c;
  renderChips();
}

// ── SEARCH ──
async function doSearch() {
  if (!sb) { alert("Not connected to database."); return; }

  page = 0;
  document.getElementById("tbody").innerHTML = '<tr class="loading-row"><td colspan="11">Searching…</td></tr>';

  try {
    let q = sb.from("lots").select("*", { count: "exact" });

    const src = document.getElementById("fSource").value;
    if (src === "heritage") q = q.eq("house_id", 1);
    else if (src === "stacks") q = q.eq("house_id", 2);

    const title = document.getElementById("fTitle").value.trim();
    if (title) q = q.ilike("description_full", `%${title}%`);

    const fr = document.getElementById("fFr").value.trim();
    if (fr) q = q.eq("fr_number", fr);

    const yr = document.getElementById("fYear").value.trim();
    if (yr) q = q.ilike("year_series", `%${yr}%`);

    const den = document.getElementById("fDenom").value;
    if (den) {
      const denNum = den.replace("$","").replace(",","");
      q = q.eq("denomination", denNum);
    }

    const svc = document.getElementById("fService").value;
    if (svc === "PMG") q = q.eq("grade_service", "PMG");
    else if (svc === "PCGS") q = q.eq("grade_service", "PCGS");
    else if (svc === "NGC") q = q.eq("grade_service", "NGC");
    else if (svc === "raw") q = q.is("grade_service", null);

    const qual = document.getElementById("fQual").value;
    if (qual === "PPQ") q = q.eq("grade_qualifiers", "PPQ");
    else if (qual === "EPQ") q = q.eq("grade_qualifiers", "EPQ");
    else if (qual === "none") q = q.is("grade_qualifiers", null);

    const gMin = document.getElementById("fGradeMin").value;
    const gMax = document.getElementById("fGradeMax").value;
    if (gMin) q = q.gte("grade_numeric", parseInt(gMin));
    if (gMax) q = q.lte("grade_numeric", parseInt(gMax));

    const pMin = document.getElementById("fPriceMin").value;
    const pMax = document.getElementById("fPriceMax").value;
    if (pMin) q = q.gte("sold_for", parseFloat(pMin));
    if (pMax) q = q.lte("sold_for", parseFloat(pMax));

    const dFrom = document.getElementById("fDateFrom").value;
    const dTo = document.getElementById("fDateTo").value;
    if (dFrom) q = q.gte("auction_end_date", dFrom);
    if (dTo) q = q.lte("auction_end_date", dTo);

    if (document.getElementById("fStar").checked) q = q.eq("is_star", true);

    if (activeCat) q = q.ilike("category_parent", `${activeCat}%`);

    const st = document.getElementById("fState").value.trim().toUpperCase();
    if (st) q = q.eq("state", st);

    const ch = document.getElementById("fCharter").value.trim();
    if (ch) q = q.eq("charter_number", ch);

    q = q.order(sortCol, { ascending: sortAsc, nullsFirst: false });
    q = q.range(page * PER, (page + 1) * PER - 1);

    const { data, count, error } = await q;
    if (error) throw error;

    rows = data || [];
    totalMatching = count || 0;
    document.getElementById("matchCount").textContent = totalMatching.toLocaleString();

    renderTable();
    renderPager();
    computeEstimate();

  } catch (e) {
    console.error("Search error:", e);
    document.getElementById("tbody").innerHTML = `<tr class="empty-row"><td colspan="11" style="color:var(--red)">Search failed: ${e.message}</td></tr>`;
  }
}

// ── RENDER TABLE ──
function renderTable() {
  if (rows.length === 0) {
    document.getElementById("tbody").innerHTML = '<tr class="empty-row"><td colspan="11">No results match your filters</td></tr>';
    return;
  }
  document.getElementById("tbody").innerHTML = rows.map((r, i) => {
    const n = page * PER + i + 1;
    const price = r.sold_for ? "$" + Number(r.sold_for).toLocaleString() : "—";
    const dt = r.auction_end_date || "—";
    const star = r.is_star ? "★" : "";
    const fr = r.fr_number ? "Fr." + r.fr_number : "—";
    const den = r.denomination ? "$" + r.denomination : "—";
    const cat = r.category_parent ? r.category_parent.split("»")[0].trim() : "—";
    const grade = r.grade_text || "—";
    const src = r.house_id === 1 ? "HA" : r.house_id === 2 ? "SB" : "—";
    const desc = r.description_full || "—";
    const url = r.lot_url || "#";
    const descShort = desc.length > 80 ? desc.substring(0, 77) + "…" : desc;
    return `<tr>
      <td>${n}</td>
      <td><a href="${url}" target="_blank" title="${desc.replace(/"/g,'&quot;')}">${descShort}</a></td>
      <td>${fr}</td>
      <td>${r.year_series || "—"}</td>
      <td>${den}</td>
      <td>${cat}</td>
      <td>${grade}</td>
      <td style="color:var(--gold)">${star}</td>
      <td>${price}</td>
      <td>${dt}</td>
      <td>${src}</td>
    </tr>`;
  }).join("");
}

// ── PAGINATION ──
function renderPager() {
  const maxPage = Math.max(0, Math.ceil(totalMatching / PER) - 1);
  document.getElementById("pgInfo").textContent = totalMatching > 0 ? `Page ${page + 1} of ${maxPage + 1} (${totalMatching.toLocaleString()} results)` : "—";
  document.getElementById("pgPrev").disabled = page <= 0;
  document.getElementById("pgNext").disabled = page >= maxPage;
}

function changePage(d) {
  page += d;
  doSearch();
}

// ── SORT ──
document.querySelectorAll("th[data-col]").forEach(th => {
  th.addEventListener("click", () => {
    const col = th.dataset.col;
    if (col === "row") return;
    if (sortCol === col) { sortAsc = !sortAsc; }
    else { sortCol = col; sortAsc = true; }
    document.querySelectorAll("th").forEach(t => t.classList.remove("sorted"));
    th.classList.add("sorted");
    doSearch();
  });
});

// ── ESTIMATE ──
async function computeEstimate() {
  const estPrice = document.getElementById("estPrice");
  const estMean = document.getElementById("estMean");
  const estRange = document.getElementById("estRange");
  const estN = document.getElementById("estN");

  if (!sb || totalMatching < 3) {
    estPrice.textContent = "—";
    estMean.textContent = "—";
    estRange.textContent = "—";
    estN.textContent = totalMatching < 3 ? "Need 3+ priced comps" : "—";
    return;
  }

  try {
    let q = sb.from("lots").select("sold_for,auction_end_date");

    const src = document.getElementById("fSource").value;
    if (src === "heritage") q = q.eq("house_id", 1);
    else if (src === "stacks") q = q.eq("house_id", 2);

    const fr = document.getElementById("fFr").value.trim();
    if (fr) q = q.eq("fr_number", fr);

    const den = document.getElementById("fDenom").value;
    if (den) q = q.eq("denomination", den.replace("$","").replace(",",""));

    const gMin = document.getElementById("fGradeMin").value;
    const gMax = document.getElementById("fGradeMax").value;
    if (gMin) q = q.gte("grade_numeric", parseInt(gMin));
    if (gMax) q = q.lte("grade_numeric", parseInt(gMax));

    const svc = document.getElementById("fService").value;
    if (svc === "PMG") q = q.eq("grade_service", "PMG");
    else if (svc === "PCGS") q = q.eq("grade_service", "PCGS");

    if (activeCat) q = q.ilike("category_parent", `${activeCat}%`);
    if (document.getElementById("fStar").checked) q = q.eq("is_star", true);

    const st = document.getElementById("fState").value.trim().toUpperCase();
    if (st) q = q.eq("state", st);

    q = q.not("sold_for", "is", null).gt("sold_for", 0).order("auction_end_date", { ascending: false }).limit(2000);

    const { data, error } = await q;
    if (error || !data || data.length < 3) {
      estPrice.textContent = "—";
      estMean.textContent = "—";
      estRange.textContent = "—";
      estN.textContent = (data ? data.length : 0) + " priced (need 3+)";
      return;
    }

    const now = Date.now();
    const HALF_LIFE = 365 * 24 * 3600 * 1000;
    let wSum = 0, wTot = 0;
    const prices = data.map(r => r.sold_for);

    data.forEach(r => {
      const dt = r.auction_end_date ? new Date(r.auction_end_date).getTime() : now - HALF_LIFE;
      const age = now - dt;
      const w = Math.pow(0.5, age / HALF_LIFE);
      wSum += r.sold_for * w;
      wTot += w;
    });

    const weighted = wSum / wTot;
    const mean = prices.reduce((a, b) => a + b, 0) / prices.length;
    const lo = Math.min(...prices);
    const hi = Math.max(...prices);

    estPrice.textContent = "$" + Math.round(weighted).toLocaleString();
    estMean.textContent = "$" + Math.round(mean).toLocaleString();
    estRange.textContent = "$" + Math.round(lo).toLocaleString() + " / $" + Math.round(hi).toLocaleString();
    estN.textContent = data.length.toLocaleString() + " sales";

  } catch(e) {
    console.warn("Estimate error:", e);
  }
}

// ── CLEAR ──
function clearFilters() {
  document.querySelectorAll(".filters input, .nbn-row input").forEach(i => i.value = "");
  document.querySelectorAll(".filters select").forEach(s => s.selectedIndex = 0);
  document.getElementById("fStar").checked = false;
  activeCat = "";
  renderChips();
  rows = [];
  totalMatching = 0;
  renderTable();
  renderPager();
  document.getElementById("estPrice").textContent = "—";
  document.getElementById("estMean").textContent = "—";
  document.getElementById("estRange").textContent = "—";
  document.getElementById("estN").textContent = "—";
  document.getElementById("matchCount").textContent = "—";
}

// ── EXPORT CSV ──
async function exportCSV() {
  if (!sb || totalMatching === 0) return alert("Run a search first.");
  const csvRows = [Object.keys(rows[0] || {}).join(",")];
  rows.forEach(r => {
    csvRows.push(Object.values(r).map(v => `"${String(v || "").replace(/"/g,'""')}"`).join(","));
  });
  const blob = new Blob(["\uFEFF" + csvRows.join("\n")], { type: "text/csv;charset=utf-8;" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "currency_comps_export.csv";
  a.click();
}

// ── ENTER TO SEARCH ──
document.querySelectorAll(".filters input, .nbn-row input").forEach(el => {
  el.addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });
});

// ── INIT ──
initSupabase();
</script>
