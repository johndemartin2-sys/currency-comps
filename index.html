<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Currency Comps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #0b0b0f;
  --surface: #141419;
  --surface2: #1a1a22;
  --surface3: #22222e;
  --border: #2a2a38;
  --border-hi: #3a3a4a;
  --gold: #c9a84c;
  --gold-dim: #8a7535;
  --gold-glow: #c9a84c22;
  --text: #e4e0d8;
  --text2: #b8b4ac;
  --muted: #706c64;
  --accent: #5ca0e8;
  --red: #d44;
  --green: #4a8;
  --font-body: 'DM Sans', system-ui, sans-serif;
  --font-display: 'Playfair Display', Georgia, serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
body.light {
  --bg: #f5f2ec; --surface: #ffffff; --surface2: #f0ede5; --surface3: #e8e4dc;
  --border: #d5d0c5; --border-hi: #c0bbb0; --text: #1a1815; --text2: #4a4540;
  --muted: #8a857e; --gold-glow: #c9a84c11;
}

/* ── HEADER ── */
.hdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 24px; border-bottom: 1px solid var(--border);
  background: var(--surface);
  position: sticky; top: 0; z-index: 100;
}
.hdr-left { display: flex; align-items: baseline; gap: 10px; }
.hdr h1 {
  font-family: var(--font-display); font-size: 24px; font-weight: 800;
  color: var(--gold); letter-spacing: .5px;
}
.hdr .ver { font-size: 11px; color: var(--muted); font-weight: 500; }
.hdr-right { display: flex; align-items: center; gap: 16px; font-size: 13px; }
.stat { color: var(--muted); }
.stat b { color: var(--text2); font-weight: 600; }
.conn-pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 10px 3px 8px; border-radius: 20px;
  background: var(--surface2); border: 1px solid var(--border);
  font-size: 12px; color: var(--muted); font-weight: 500;
}
.conn-dot {
  width: 7px; height: 7px; border-radius: 50%;
  flex-shrink: 0;
}
.conn-dot.ok { background: var(--green); box-shadow: 0 0 6px var(--green); }
.conn-dot.err { background: var(--red); box-shadow: 0 0 6px var(--red); }
.conn-dot.loading { background: var(--gold); animation: pulse .8s infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.theme-btn {
  background: none; border: 1px solid var(--border); color: var(--muted);
  cursor: pointer; border-radius: 6px; padding: 4px 10px; font-size: 15px;
  transition: border-color .15s;
}
.theme-btn:hover { border-color: var(--gold-dim); }

/* ── ERROR BANNER ── */
.conn-banner {
  background: #2a1515; color: #faa; padding: 10px 24px; font-size: 13px;
  display: none; align-items: center; gap: 12px;
  border-bottom: 1px solid #4a2020;
}
.conn-banner.show { display: flex; }
.conn-banner button {
  background: var(--red); color: #fff; border: none; padding: 4px 14px;
  border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600;
}

/* ── FILTERS ── */
.filters-wrap {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 16px 24px 0;
}
.filters {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end;
}
.fg { display: flex; flex-direction: column; gap: 3px; }
.fg label {
  font-size: 10px; text-transform: uppercase; letter-spacing: .8px;
  color: var(--muted); font-weight: 600;
}
.fg input, .fg select {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); padding: 6px 10px; border-radius: 5px;
  font-size: 13px; font-family: var(--font-body); width: 120px;
  transition: border-color .15s;
}
.fg input:focus, .fg select:focus { outline: none; border-color: var(--gold); }
.fg.wide input { width: 200px; }
.fg.narrow input { width: 70px; }
.fg.xs input { width: 55px; }

/* ── CATEGORY CHIPS ── */
.chips-row {
  display: flex; flex-wrap: wrap; gap: 5px;
  padding: 10px 0 14px;
}
.chip {
  padding: 4px 12px; border-radius: 14px; font-size: 12px; font-weight: 500;
  cursor: pointer; border: 1px solid var(--border); background: var(--surface2);
  color: var(--muted); transition: all .15s; user-select: none;
}
.chip.active { background: var(--gold); color: #0b0b0f; border-color: var(--gold); font-weight: 600; }
.chip:hover:not(.active) { border-color: var(--gold-dim); color: var(--text2); }

/* ── NATIONAL BANK SECTION ── */
.nbn-toggle {
  cursor: pointer; color: var(--gold-dim); font-size: 12px; font-weight: 500;
  padding: 0 24px 4px; background: var(--surface); user-select: none;
  letter-spacing: .3px;
}
.nbn-toggle:hover { color: var(--gold); }
.nbn-row {
  display: none; padding: 6px 24px 10px; background: var(--surface);
  gap: 10px; align-items: flex-end;
}
.nbn-row.show { display: flex; }

/* ── STAR TOGGLE ── */
.star-toggle {
  display: flex; align-items: center; gap: 5px;
  font-size: 13px; color: var(--gold); cursor: pointer; user-select: none;
}
.star-toggle input { accent-color: var(--gold); cursor: pointer; }

/* ── BUTTON ROW ── */
.btn-row {
  display: flex; gap: 8px; padding: 12px 24px;
  background: var(--surface); border-bottom: 1px solid var(--border);
}
.btn {
  padding: 8px 20px; border-radius: 5px; border: none; cursor: pointer;
  font-size: 13px; font-weight: 600; font-family: var(--font-body);
  transition: all .15s;
}
.btn-go { background: var(--gold); color: #0b0b0f; }
.btn-go:hover { background: #d4b458; }
.btn-clear { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
.btn-clear:hover { border-color: var(--border-hi); }
.btn-export { background: var(--surface2); color: var(--accent); border: 1px solid var(--border); }
.btn-export:hover { border-color: var(--accent); }

/* ── ESTIMATE CARD ── */
.est-card {
  margin: 16px 24px; padding: 14px 20px;
  background: linear-gradient(135deg, var(--surface2), var(--surface3));
  border: 1px solid var(--border); border-radius: 8px;
  display: flex; gap: 30px; align-items: center;
  box-shadow: 0 2px 12px var(--gold-glow);
}
.est-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; font-weight: 600; }
.est-price { font-family: var(--font-display); font-size: 28px; font-weight: 700; color: var(--gold); margin-top: 2px; }
.est-meta { color: var(--text2); font-size: 13px; line-height: 1.7; }
.est-meta span { color: var(--muted); }

/* ── TABLE ── */
.tbl-wrap { overflow-x: auto; padding: 0 24px; }
table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
thead { position: static; z-index: 10; background: var(--bg); }
th {
  text-align: left; padding: 9px 6px; border-bottom: 2px solid var(--border);
  color: var(--muted); font-size: 10px; text-transform: uppercase;
  letter-spacing: .7px; font-weight: 600; cursor: pointer;
  white-space: nowrap; user-select: none; transition: color .12s;
}
th:hover { color: var(--gold); }
th.sorted { color: var(--gold); }
th.sorted::after { content: ' ▾'; font-size: 9px; }
th.sorted.asc::after { content: ' ▴'; }
td {
  padding: 7px 6px; border-bottom: 1px solid var(--border);
  white-space: nowrap; font-size: 12px;
}
tr:hover td { background: var(--surface2); }
td a { color: var(--accent); text-decoration: none; }
td a:hover { text-decoration: underline; }
.loading-row td { text-align: center; color: var(--muted); padding: 40px; font-size: 14px; }
.empty-row td { text-align: center; color: var(--muted); padding: 40px; }

/* ── PAGINATION ── */
.pager {
  display: flex; justify-content: center; align-items: center;
  gap: 14px; padding: 16px; font-size: 13px; color: var(--muted);
}
.pager button {
  background: var(--surface2); color: var(--text); border: 1px solid var(--border);
  padding: 6px 16px; border-radius: 5px; cursor: pointer;
  font-family: var(--font-body); font-weight: 500; transition: border-color .15s;
}
.pager button:hover:not(:disabled) { border-color: var(--gold-dim); }
.pager button:disabled { opacity: .3; cursor: default; }

/* ── RESPONSIVE ── */
@media (max-width: 768px) {
  .hdr { flex-direction: column; gap: 8px; align-items: flex-start; }
  .hdr-right { flex-wrap: wrap; gap: 8px; }
  .filters { gap: 6px; }
  .fg input, .fg select { font-size: 14px; }
  .est-card { flex-direction: column; gap: 10px; }
}
</style>
</head>
<body>

<!-- ═══ HEADER ═══ -->
<div class="hdr">
  <div class="hdr-left">
    <h1>Currency Comps</h1>
    <span class="ver">v2.6</span>
  </div>
  <div class="hdr-right">
    <span class="conn-pill"><span class="conn-dot loading" id="connDot"></span><span id="connLabel">Connecting…</span></span>
    <span class="stat">HA: <b id="haCount">—</b></span>
    <span class="stat">SB: <b id="sbCount">—</b></span>
    <span class="stat">Total: <b id="totalCount">—</b></span>
    <span class="stat">Matching: <b id="matchCount">—</b></span>
    <button class="theme-btn" onclick="toggleTheme()" title="Toggle light/dark">☾</button>
  </div>
</div>

<!-- ═══ ERROR BANNER ═══ -->
<div class="conn-banner" id="connBanner">
  <span id="connError">Connection failed</span>
  <button onclick="initSupabase()">Retry</button>
</div>

<!-- ═══ FILTERS ═══ -->
<div class="filters-wrap">
  <div class="filters">
    <div class="fg"><label>Source</label>
      <select id="fSource">
        <option value="">All sources</option>
        <option value="heritage_auctions">Heritage Auctions</option>
        <option value="stacks_bowers">Stack's Bowers</option>
      </select>
    </div>
    <div class="fg wide"><label>Title contains</label><input id="fTitle" placeholder=""></div>
    <div class="fg"><label>Friedberg #</label><input id="fFr" placeholder="" style="width:100px"></div>
    <div class="fg narrow"><label>Year</label><input id="fYear" type="number" placeholder=""></div>
    <div class="fg xs"><label>Letter</label><input id="fLetter" placeholder=""></div>
    <div class="fg"><label>Denom</label>
      <select id="fDenom">
        <option value="">any</option>
        <option>$1</option><option>$2</option><option>$5</option><option>$10</option>
        <option>$20</option><option>$50</option><option>$100</option><option>$500</option>
        <option>$1000</option><option>$5000</option><option>$10000</option>
      </select>
    </div>
    <div class="fg"><label>Grading Co.</label>
      <select id="fService">
        <option value="">any</option>
        <option value="PMG">PMG</option>
        <option value="PCGS">PCGS</option>
        <option value="NGC">NGC</option>
        <option value="raw">raw</option>
        <option value="unknown">unknown</option>
      </select>
    </div>
    <div class="fg"><label>PPQ/EPQ</label>
      <select id="fQual">
        <option value="">any</option>
        <option value="PPQ">PPQ</option>
        <option value="EPQ">EPQ</option>
        <option value="none">none</option>
      </select>
    </div>
    <div class="fg narrow"><label>Grade min</label><input id="fGradeMin" type="number"></div>
    <div class="fg narrow"><label>Grade max</label><input id="fGradeMax" type="number"></div>
    <div class="fg"><label>Price min</label><input id="fPriceMin" type="number" style="width:95px"></div>
    <div class="fg"><label>Price max</label><input id="fPriceMax" type="number" style="width:95px"></div>
    <div class="fg"><label>From</label><input id="fDateFrom" type="date"></div>
    <div class="fg"><label>To</label><input id="fDateTo" type="date"></div>
    <label class="star-toggle"><input type="checkbox" id="fStar"> ★ Star only</label>
  </div>
  <div class="chips-row" id="catChips"></div>
</div>

<div class="nbn-toggle" onclick="document.querySelector('.nbn-row').classList.toggle('show')">▸ National Banks (charter / state)</div>
<div class="nbn-row">
  <div class="fg"><label>State</label><input id="fState" placeholder="" style="width:60px" maxlength="2"></div>
  <div class="fg"><label>Charter #</label><input id="fCharter" placeholder="" style="width:90px"></div>
</div>

<div class="btn-row">
  <button class="btn btn-go" onclick="doSearch()">Apply filters</button>
  <button class="btn btn-clear" onclick="clearFilters()">Clear</button>
  <button class="btn btn-export" onclick="exportCSV()">Export CSV</button>
</div>

<!-- ═══ ESTIMATE CARD ═══ -->
<div class="est-card">
  <div>
    <div class="est-label">Current Estimated Price</div>
    <div class="est-price" id="estPrice">—</div>
  </div>
  <div class="est-meta">
    <div><span>Mean</span> <b id="estMean">—</b></div>
    <div><span>Low / High</span> <b id="estRange">—</b></div>
    <div><span>Sample size</span> <b id="estN">—</b></div>
  </div>
</div>

<!-- ═══ TABLE ═══ -->
<div class="tbl-wrap">
<table>
<thead><tr>
  <th data-col="_row">#</th>
  <th data-col="title" class="sorted">Title</th>
  <th data-col="friedberg_number">Fr.</th>
  <th data-col="sold_year">Year</th>
  <th data-col="denomination">Denom</th>
  <th data-col="series_type">Type</th>
  <th data-col="grade_raw">Grade</th>
  <th data-col="is_star_note">★</th>
  <th data-col="price_realized">Sold</th>
  <th data-col="sold_on">Date</th>
  <th data-col="source">Src</th>
</tr></thead>
<tbody id="tbody">
  <tr class="loading-row"><td colspan="11">Connecting to database…</td></tr>
</tbody>
</table>
</div>

<!-- ═══ PAGINATION ═══ -->
<div class="pager">
  <button id="pgPrev" onclick="changePage(-1)" disabled>‹ Prev</button>
  <span id="pgInfo">—</span>
  <button id="pgNext" onclick="changePage(1)" disabled>Next ›</button>
</div>

<script>
// ═══ SUPABASE CONFIG ═══
const SUPABASE_URL = "https://wqizwluccqqfkedpgvve.supabase.co";
const SUPABASE_KEY = "sb_publishable_9DiOeDQje6yiSEITD7WUrw_S2Q-2xyS";
const TABLE = "lots_currency";
const DQ_FILTER = ["trusted", "rescraped"];
// ═══════════════

let sb = null;
let rows = [];
let page = 0;
const PER = 50;
let sortCol = "sold_on";
let sortAsc = false;
let totalMatching = 0;
let seriesTypes = [];
let activeSeries = ""; let hasSearched = false;

// ── THEME ──
function toggleTheme() {
  document.body.classList.toggle("light");
  localStorage.setItem("cc_theme", document.body.classList.contains("light") ? "light" : "dark");
}
if (localStorage.getItem("cc_theme") === "light") document.body.classList.add("light");

// ── SUPABASE INIT ──
async function countWithRetry(build, tries = 4) { for (let i = 0; i < tries; i++) { try { const { count, error } = await build(sb.from(TABLE).select("*", { count: "exact", head: true })); if (!error) return count; } catch (e) {} await new Promise(r => setTimeout(r, 300 * (i + 1))); } return null; }
async function initSupabase() {
  const dot = document.getElementById("connDot");
  const label = document.getElementById("connLabel");
  const banner = document.getElementById("connBanner");
  const errEl = document.getElementById("connError");

  dot.className = "conn-dot loading";
  label.textContent = "Connecting…";
  banner.classList.remove("show");

  try {
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const total = await countWithRetry(q => q.in("data_quality", DQ_FILTER)); if (total === null) throw new Error("Database unreachable");

    const haC = await countWithRetry(q => q.eq("source", "heritage_auctions").in("data_quality", DQ_FILTER)); const sbC = await countWithRetry(q => q.eq("source", "stacks_bowers").in("data_quality", DQ_FILTER));

    dot.className = "conn-dot ok";
    label.textContent = (total === null ? "—" : fmt(total)) + " lots"; document.getElementById("totalCount").textContent = total === null ? "—" : fmt(total); document.getElementById("haCount").textContent = haC === null ? "—" : fmt(haC); document.getElementById("sbCount").textContent = sbC === null ? "—" : fmt(sbC);

    await loadSeriesTypes(); if (hasSearched) return;

    document.getElementById("tbody").innerHTML =
      '<tr class="empty-row"><td colspan="11">Apply filters or search to view results</td></tr>';

  } catch (e) {
    dot.className = "conn-dot err";
    label.textContent = "Disconnected";
    let msg = e.message || "Unknown error";
    if (/cert|ssl|ERR_CERT/i.test(msg))
      msg = "SSL error — Supabase project may be paused. Restore it at supabase.com/dashboard.";
    else if (/fetch|network/i.test(msg))
      msg = "Network error — Supabase may be paused or offline.";
    errEl.textContent = msg;
    banner.classList.add("show");
    document.getElementById("tbody").innerHTML =
      '<tr class="empty-row"><td colspan="11" style="color:var(--red)">Database connection failed — see error above.</td></tr>';
    console.error("Supabase init error:", e);
  }
}

// ── SERIES TYPE CHIPS ──
async function loadSeriesTypes() {
  try {
    const { data } = await sb
      .from(TABLE)
      .select("series_type")
      .in("data_quality", DQ_FILTER)
      .not("series_type", "is", null)
      .limit(5000);
    const set = new Set();
    (data || []).forEach(r => { if (r.series_type) set.add(r.series_type.trim()); });
    seriesTypes = [...set].sort();
    renderChips();
  } catch (e) { console.warn("Series type load:", e); }
}

function renderChips() {
  document.getElementById("catChips").innerHTML = seriesTypes.map(s =>
    `<span class="chip${activeSeries === s ? ' active' : ''}" onclick="toggleSeries(this, '${esc(s)}')">${s}</span>`
  ).join("");
}
function toggleSeries(el, s) { activeSeries = activeSeries === s ? "" : s; renderChips(); }
function esc(s) { return s.replace(/'/g, "\\'").replace(/"/g, "&quot;"); }

// ── SEARCH ──
async function doSearch() {
  if (!sb) return alert("Not connected to database."); hasSearched = true;
  page = 0;
  await runQuery();
}

async function runQuery() {
  document.getElementById("tbody").innerHTML =
    '<tr class="loading-row"><td colspan="11">Searching…</td></tr>';

  try {
    let q = sb.from(TABLE).select("*", { count: "exact" });
    q = applyFilters(q);
    q = q.order(sortCol, { ascending: sortAsc, nullsFirst: false });
    q = q.range(page * PER, (page + 1) * PER - 1);

    const { data, count, error } = await q;
    if (error) throw error;

    rows = data || [];
    totalMatching = count || 0;
    document.getElementById("matchCount").textContent = fmt(totalMatching);

    renderTable();
    renderPager();
    computeEstimate();
  } catch (e) {
    console.error("Search error:", e);
    document.getElementById("tbody").innerHTML =
      `<tr class="empty-row"><td colspan="11" style="color:var(--red)">Search failed: ${e.message}</td></tr>`;
  }
}

// ── APPLY FILTERS ──
function applyFilters(q) {
  q = q.in("data_quality", DQ_FILTER);
  const v = id => document.getElementById(id).value.trim();

  const src = v("fSource");
  if (src) q = q.eq("source", src);

  const title = v("fTitle");
  if (title) q = q.ilike("title", `%${title}%`);

  const fr = v("fFr");
  if (fr) q = q.eq("friedberg_number_normalized", fr);

  const yr = v("fYear");
  if (yr) q = q.eq("series_year", parseInt(yr));

  const ltr = v("fLetter");
  if (ltr) q = q.eq("series_letter", ltr.trim().toUpperCase());

  const den = document.getElementById("fDenom").value;
  if (den) q = q.eq("denomination", den.replace("$", "").replace(/,/g, ""));

  const svc = v("fService");
  if (svc === "PMG" || svc === "PCGS" || svc === "NGC")
    q = q.eq("grading_company", svc);
  else if (svc === "raw")
    q = q.is("grading_company", null);

  const qual = v("fQual");
  if (qual === "PPQ") q = q.eq("ppq_epq", "PPQ");
  else if (qual === "EPQ") q = q.eq("ppq_epq", "EPQ");
  else if (qual === "none") q = q.is("ppq_epq", null);

  const gMin = v("fGradeMin"), gMax = v("fGradeMax");
  if (gMin) q = q.gte("grade_numeric", parseInt(gMin));
  if (gMax) q = q.lte("grade_numeric", parseInt(gMax));

  const pMin = v("fPriceMin"), pMax = v("fPriceMax");
  if (pMin) q = q.gte("price_realized", parseFloat(pMin));
  if (pMax) q = q.lte("price_realized", parseFloat(pMax));

  const dFrom = v("fDateFrom"), dTo = v("fDateTo");
  if (dFrom) q = q.gte("sold_on", dFrom);
  if (dTo) q = q.lte("sold_on", dTo);

  if (document.getElementById("fStar").checked)
    q = q.eq("is_star_note", true);

  if (activeSeries) q = q.eq("series_type", activeSeries);

  const st = v("fState").toUpperCase();
  if (st) q = q.eq("state_code", st);

  const ch = v("fCharter");
  if (ch) q = q.eq("charter_number", ch);

  return q;
}

// ── RENDER TABLE ──
function renderTable() {
  if (!rows.length) {
    document.getElementById("tbody").innerHTML =
      '<tr class="empty-row"><td colspan="11">No results match your filters</td></tr>';
    return;
  }
  document.getElementById("tbody").innerHTML = rows.map((r, i) => {
    const n = page * PER + i + 1;
    const price = r.price_realized ? "$" + Number(r.price_realized).toLocaleString() : "—";
    const dt = r.sold_on || "—";
    const star = r.is_star_note ? "★" : "";
    const fr = r.friedberg_number || "—";
    const den = r.denomination ? "$" + r.denomination : "—";
    const sType = r.series_type || "—";
    const grade = r.grade_raw || "—";
    const srcLabel = r.source === "heritage_auctions" ? "HA"
                   : r.source === "stacks_bowers" ? "SB" : "—";
    const t = r.title || "—";
    const url = r.lot_url || "#";
    const tShort = t.length > 80 ? t.substring(0, 77) + "…" : t;

    return `<tr>
      <td>${n}</td>
      <td><a href="${url}" target="_blank" rel="noopener" title="${t.replace(/"/g,'&quot;')}">${tShort}</a></td>
      <td>${fr}</td>
      <td>${r.series_year ? r.series_year + (r.series_letter || "") : "—"}</td>
      <td>${den}</td>
      <td>${sType}</td>
      <td>${grade}</td>
      <td style="color:var(--gold)">${star}</td>
      <td>${price}</td>
      <td>${dt}</td>
      <td>${srcLabel}</td>
    </tr>`;
  }).join("");
}

// ── PAGINATION ──
function renderPager() {
  const maxP = Math.max(0, Math.ceil(totalMatching / PER) - 1);
  document.getElementById("pgInfo").textContent = totalMatching > 0
    ? `Page ${page + 1} of ${maxP + 1} (${fmt(totalMatching)} results)`
    : "—";
  document.getElementById("pgPrev").disabled = page <= 0;
  document.getElementById("pgNext").disabled = page >= maxP;
}
function changePage(d) { page += d; runQuery(); }

// ── SORT ──
document.querySelectorAll("th[data-col]").forEach(th => {
  th.addEventListener("click", () => {
    const col = th.dataset.col;
    if (col === "_row") return;
    if (sortCol === col) sortAsc = !sortAsc;
    else { sortCol = col; sortAsc = col === "title"; }
    document.querySelectorAll("th").forEach(t => { t.classList.remove("sorted","asc"); });
    th.classList.add("sorted");
    if (sortAsc) th.classList.add("asc");
    doSearch();
  });
});

// ── ESTIMATE ──
async function computeEstimate() {
  const elP = document.getElementById("estPrice");
  const elM = document.getElementById("estMean");
  const elR = document.getElementById("estRange");
  const elN = document.getElementById("estN");

  if (!sb || totalMatching === 0) {
    elP.textContent = elM.textContent = elR.textContent = "—";
    elN.textContent = totalMatching === 0 ? "—" : "Need 3+ priced sales";
    return;
  }

  try {
    let q = sb.from(TABLE).select("price_realized,sold_on");
    q = applyFilters(q);
    q = q.not("price_realized", "is", null)
         .gt("price_realized", 0)
         .order("sold_on", { ascending: false })
         .limit(2000);

    const { data, error } = await q;
    if (error || !data || data.length < 3) {
      elP.textContent = elM.textContent = elR.textContent = "—";
      elN.textContent = (data ? data.length : 0) + " priced (need 3+)";
      return;
    }

    const now = Date.now();
    const HL = 365 * 86400000;
    let wSum = 0, wTot = 0;
    const prices = [];

    data.forEach(r => {
      const p = Number(r.price_realized);
      if (!p || p <= 0) return;
      prices.push(p);
      const dt = r.sold_on ? new Date(r.sold_on).getTime() : now - HL;
      const w = Math.pow(0.5, (now - dt) / HL);
      wSum += p * w;
      wTot += w;
    });

    if (prices.length < 3) {
      elP.textContent = elM.textContent = elR.textContent = "—";
      elN.textContent = prices.length + " priced (need 3+)";
      return;
    }

    elP.textContent = "$" + Math.round(wSum / wTot).toLocaleString();
    elM.textContent = "$" + Math.round(prices.reduce((a,b) => a+b, 0) / prices.length).toLocaleString();
    elR.textContent = "$" + Math.min(...prices).toLocaleString() + " / $" + Math.max(...prices).toLocaleString();
    elN.textContent = fmt(prices.length) + " sales";
  } catch (e) { console.warn("Estimate:", e); }
}

// ── CLEAR ──
function clearFilters() {
  document.querySelectorAll(".filters input, .nbn-row input").forEach(i => { i.value = ""; });
  document.querySelectorAll(".filters select").forEach(s => { s.selectedIndex = 0; });
  document.getElementById("fStar").checked = false;
  activeSeries = "";
  renderChips();
  rows = [];
  totalMatching = 0;
  renderTable();
  renderPager();
  document.getElementById("estPrice").textContent = "—";
  document.getElementById("estMean").textContent = "—";
  document.getElementById("estRange").textContent = "—";
  document.getElementById("estN").textContent = "—";
  document.getElementById("matchCount").textContent = "—";
}

// ── EXPORT CSV ──
async function exportCSV() {
  if (!sb) return alert("Not connected.");
  if (totalMatching === 0) return alert("Run a search first.");

  const btn = document.querySelector(".btn-export");
  btn.textContent = "Exporting…";
  btn.disabled = true;

  try {
    let q = sb.from(TABLE).select(
      "source,source_lot_id,title,friedberg_number,friedberg_number_normalized,sold_on,sold_year,series_year,series_letter,"
      + "price_realized,denomination,series_type,grading_company,grade_raw,grade_numeric,ppq_epq,"
      + "is_star_note,state_code,charter_number,auction_event_name,lot_url"
    );
    q = applyFilters(q);
    q = q.order(sortCol, { ascending: sortAsc }).limit(5000);

    const { data, error } = await q;
    if (error) throw error;
    if (!data || !data.length) { alert("No data to export."); return; }

    const cols = Object.keys(data[0]);
    const csvRows = [cols.join(",")];
    data.forEach(r => {
      csvRows.push(cols.map(c => {
        let v = String(r[c] ?? "");
        if (/[,"\n]/.test(v)) v = '"' + v.replace(/"/g, '""') + '"';
        return v;
      }).join(","));
    });

    const blob = new Blob(["\uFEFF" + csvRows.join("\n")], { type: "text/csv;charset=utf-8;" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "currency_comps_" + new Date().toISOString().slice(0,10) + ".csv";
    a.click();
    URL.revokeObjectURL(a.href);
  } catch (e) {
    alert("Export failed: " + e.message);
    console.error(e);
  } finally {
    btn.textContent = "Export CSV";
    btn.disabled = false;
  }
}

// ── ENTER KEY → SEARCH ──
document.querySelectorAll(".filters input, .nbn-row input").forEach(el => {
  el.addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });
});

// ── HELPERS ──
function fmt(n) { return (n || 0).toLocaleString(); }

// ── BOOT ──
initSupabase();
</script>
